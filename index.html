<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- YouTube's embed refuses to play (error 153) if it can't see which site it's on -->
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Deadlock Radio</title>
<!--
  Deadlock Radio player page (Panel B). Hosted on GitHub Pages.
  The game talks to this page two ways:
    in:  the mod changes this page's URL hash to  #c:<seq>:window.lkSomething(...)
    out: this page writes JSON into document.title, the game gets it as an HTMLTitle event.
  Everything that plays is an official embedded player (YouTube or SoundCloud), controlled by the script below.
  Mod v1.3: playlists, Mix autoplay for single YouTube songs, embed-blocked detection, SoundCloud,
            sharing / update check / feedback moved here from the old injected script.
-->
<style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0d0f12; color: #e7e2d6; font-family: Arial, sans-serif; overflow: hidden; }
    #bar { display: flex; gap: 8px; padding: 10px; box-sizing: border-box; background: #14171c; border-bottom: 1px solid #2a2f37; }
    #url { flex: 1; min-width: 0; padding: 8px 10px; font-size: 15px; color: #e7e2d6; background: #0d0f12; border: 1px solid #2a2f37; border-radius: 6px; outline: none; }
    #url:focus { border-color: #4caf82; }
    #go { padding: 8px 16px; font-size: 15px; font-weight: bold; color: #0d0f12; background: #6fe0a8; border: 0; border-radius: 6px; cursor: pointer; }
    #go:hover { background: #8aeabd; }
    #wrap { position: absolute; top: 55px; left: 0; right: 0; bottom: 0; }
    #player { width: 100%; height: 100%; }
    #scwrap { position: absolute; top: 55px; left: 0; right: 0; bottom: 0; display: none; }
    #scwrap iframe { width: 100%; height: 100%; border: 0; }
    body.sc #wrap { display: none; }
    body.sc #scwrap { display: block; }
    #hint { position: absolute; top: 55px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #6a7078; font-size: 16px; padding: 0 24px; }
    #gate { position: absolute; top: 55px; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #0d0f12; text-align: center; padding: 0 24px; z-index: 5; }
    #gate.on { display: flex; }
    #gateBtn { padding: 18px 28px; font-size: 22px; font-weight: bold; color: #0d0f12; background: #6fe0a8; border: 0; border-radius: 10px; cursor: pointer; }
    #gateBtn:hover { background: #8aeabd; }
    #gateSub { margin-top: 14px; color: #8a9099; font-size: 14px; }
</style>
</head>
<body>
<div id="bar">
    <input id="url" type="text" placeholder="Paste a YouTube song or playlist link, then press Enter" autocomplete="off" spellcheck="false" />
    <button id="go">Play</button>
</div>
<div id="wrap"><div id="player"></div></div>
<div id="scwrap"></div>
<div id="hint">Paste a YouTube song or playlist link above, or press Play on one in the Library tab.</div>
<div id="gate"><button id="gateBtn">&#9654; Click to start Deadlock Radio</button><div id="gateSub">One click per session, then songs play on their own.</div></div>
<script>
(function () {
    "use strict";
    var API = 'https://relay-ckjvp.dlr-k7q2m9x.workers.dev/';
    var API_KEY = 'anrKvZKLlQaJZu1ScaK9kM9z';
    var RELAY = 'wss://relay-ckjvp.dlr-k7q2m9x.workers.dev/r/' + API_KEY + '/';
    var SKEY = 'dlm_settings';
    var ID_RE = /^[A-Za-z0-9_-]{11}$/;
    var LIST_RE = /^[A-Za-z0-9_-]{2,64}$/;

    var SC_RE = /^https?:\/\/((www|m|on)\.)?soundcloud\.com\/\S+$/i;
    var player = null, ready = false, wantVol = 30, lastMetaId = '', activated = false;
    var mode = 'youtube';    // which player is showing: 'youtube' or 'soundcloud'
    var sc = { w: null, ready: false, iframe: null, metaId: '', loading: '' };
    var pending = null;      // what to play once the player is ready / the gate is clicked
    var cur = null;          // what we last asked for: { id, list, at, mix, seekDone, startedAt }

    // ---------- messages out (document.title) ----------
    // Title changes too close together can get merged by the game, so space them out.
    var outQ = [], outAt = 0, outT = null, seq = 0;
    function flushOut() {
        outT = null;
        if (!outQ.length) return;
        var wait = 70 - (Date.now() - outAt);
        if (wait > 0) { outT = setTimeout(flushOut, wait); return; }
        outAt = Date.now();
        try { document.title = outQ.shift(); } catch (e) { }
        if (outQ.length) outT = setTimeout(flushOut, 70);
    }
    function send(t, d) {
        var msg = JSON.stringify({ t: t, d: d || {}, z: ++seq });
        if (t === 'tick' || t === 'st' || t === 'hb') {
            for (var i = outQ.length - 1; i >= 0; i--) {
                if (outQ[i].indexOf('{"t":"' + t + '"') === 0) { outQ[i] = msg; if (!outT) flushOut(); return; }
            }
        }
        outQ.push(msg);
        if (outQ.length > 40) outQ.splice(0, outQ.length - 40);
        if (!outT) flushOut();
    }
    // Important messages repeat until the mod acks them (window.lkAck).
    var pid = Math.floor(Math.random() * 1e9).toString(36), relN = 0, relQ = {};
    function sendSure(t, d) { d = d || {}; d.q = pid + '-' + (++relN); relQ[d.q] = { t: t, d: d, tries: 0 }; send(t, d); }
    window.lkAck = function (q) { delete relQ[q]; };
    setInterval(function () { for (var k in relQ) { var m = relQ[k]; if (++m.tries > 12) { delete relQ[k]; continue; } send(m.t, m.d); } }, 600);

    // ---------- settings (kept on this site's storage so they survive restarts) ----------
    function readSettings() { try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return null; } }
    function writeSettings(o) { try { localStorage.setItem(SKEY, JSON.stringify(o)); } catch (e) { } }
    function hello() { send('bridge', { href: location.href, saved: readSettings() }); }
    window.lkHello = hello;

    // ---------- the YouTube player ----------
    function vdata() { try { return (player && player.getVideoData) ? player.getVideoData() : null; } catch (e) { return null; } }
    function curPos() { try { return player ? (player.getCurrentTime() || 0) : 0; } catch (e) { return 0; } }
    function hideHint() { var h = document.getElementById('hint'); if (h) h.style.display = 'none'; }

    function sendMeta() {
        var d = vdata();
        if (!d || !d.video_id) return;
        lastMetaId = d.video_id;
        send('meta', { id: d.video_id, title: d.title || 'Unknown', author: d.author || '' });
        // getVideoData can be stale right after a switch, oEmbed gives the real title
        var vid = d.video_id;
        fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + vid))
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) { if (j && j.title && lastMetaId === vid) send('meta', { id: vid, title: String(j.title), author: String(j.author_name || ''), fixed: true }); })
            .catch(function () { });
    }

    // When a playlist loads, jump to the song that was actually clicked.
    function fixPlaylistStart() {
        if (!cur || cur.seekDone || !cur.list || !cur.id) return;
        var pl = null;
        try { pl = player.getPlaylist(); } catch (e) { }
        if (!pl || !pl.length) return;
        cur.seekDone = true;
        var idx = pl.indexOf(cur.id);
        var now = -1; try { now = player.getPlaylistIndex(); } catch (e) { }
        if (idx > 0 && idx !== now) { try { player.playVideoAt(idx); } catch (e) { } return; }
        if (idx < 0 && cur.mix) {
            // The Mix didn't start with our song; play the song by itself instead.
            send('mixmiss', { id: cur.id });
            loadSingle(cur.id, cur.at);
        }
    }

    function onState(e) {
        if (!window.YT) return;
        if (e.data === YT.PlayerState.PLAYING) {
            hideHint();
            fixPlaylistStart();
            var d = vdata();
            if (d && d.video_id && d.video_id !== lastMetaId) sendMeta();
            send('play');
        } else if (e.data === YT.PlayerState.PAUSED) {
            send('pause');
        } else if (e.data === YT.PlayerState.ENDED) {
            send('ended');
        } else if (e.data === YT.PlayerState.CUED || e.data === YT.PlayerState.BUFFERING) {
            fixPlaylistStart();
        }
    }

    function onError(e) {
        var code = e && e.data;
        var d = vdata();
        var id = (d && d.video_id) || (cur && cur.id) || '';
        // A generated Mix that won't load at all: fall back to just the song.
        if (cur && cur.mix && !cur.seekDone && (code === 2 || code === 100 || code === 5)) {
            send('mixmiss', { id: cur.id, code: code });
            loadSingle(cur.id, cur.at);
            return;
        }
        if (code === 101 || code === 150 || code === 153) {
            sendSure('blocked', { id: id, code: code });
        } else {
            sendSure('error', { id: id, code: code });
        }
        // In a playlist, skip past songs that can't play here.
        var inList = false;
        try { var pl = player.getPlaylist(); inList = !!(pl && pl.length > 1); } catch (e2) { }
        if (inList) setTimeout(function () { try { player.nextVideo(); } catch (e3) { } }, 1200);
    }

    window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
            height: '100%', width: '100%',
            playerVars: (function () {
                var pv = { autoplay: 0, controls: 1, rel: 0, playsinline: 1, iv_load_policy: 3 };
                if (/^https?:$/.test(location.protocol)) pv.origin = location.origin;
                return pv;
            })(),
            events: {
                onReady: function () {
                    ready = true;
                    try { player.setVolume(wantVol); } catch (e) { }
                    if (pending && activated) { var p = pending; pending = null; openNow(p.id, p.list, p.at); }
                },
                onStateChange: onState,
                onError: onError
            }
        });
    };
    (function () { var t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); })();

    var n = 0;
    setInterval(function () {
        n++;
        if (mode === 'soundcloud') { scTick(); return; }
        if (!ready || !player) { if (n % 4 === 0) send('hb', { n: n }); return; }
        var st = -1;
        try { st = player.getPlayerState(); } catch (e) { }
        if (st === 1) {
            var c = 0, dur = 0, d = vdata();
            try { c = player.getCurrentTime() || 0; dur = player.getDuration() || 0; } catch (e) { }
            if (d && d.video_id && d.video_id !== lastMetaId) sendMeta();
            send('tick', { id: (d && d.video_id) || '', dur: dur, cur: c });
        } else if (st === 2) {
            send('st', { playing: false });
        } else if (n % 4 === 0) {
            send('hb', { n: n });
        }
    }, 500);

    function loadSingle(id, at) {
        cur = { id: id, list: '', at: at || 0, mix: false, seekDone: true };
        try { player.loadVideoById({ videoId: id, startSeconds: at || 0 }); } catch (e) { }
    }

    // ---------- which player is showing ----------
    var HINTS = {
        youtube: ['Paste a YouTube song or playlist link, then press Enter', 'Paste a YouTube song or playlist link above, or press Play on one in the Library tab.'],
        soundcloud: ['Paste a SoundCloud track or playlist link, then press Enter', 'Paste a SoundCloud track or playlist link above, or press Play on one in the Library tab.']
    };
    function setMode(m) {
        if (m !== 'youtube' && m !== 'soundcloud') return;
        if (m === mode) return;
        // stop the other player
        if (m === 'soundcloud') { try { player && player.pauseVideo(); } catch (e) { } }
        else { try { sc.w && sc.w.pause(); } catch (e) { } }
        mode = m;
        document.body.className = m === 'soundcloud' ? 'sc' : '';
        var u = document.getElementById('url'); if (u) u.placeholder = HINTS[m][0];
        var h = document.getElementById('hint');
        if (h) {
            h.textContent = HINTS[m][1];
            var playing = m === 'soundcloud' ? !!sc.iframe : (ready && !!cur);
            h.style.display = playing ? 'none' : 'flex';
        }
        lastMetaId = ''; sc.metaId = '';
        send('src', { src: m });
    }
    window.lkSource = function (m) { setMode(String(m || '')); };

    // ---------- SoundCloud ----------
    (function () { var t = document.createElement('script'); t.src = 'https://w.soundcloud.com/player/api.js'; document.head.appendChild(t); })();
    var SC_OPTS = '&auto_play=true&visual=true&show_comments=false&show_reposts=false&show_teaser=false&hide_related=false';

    function scMeta() {
        if (!sc.w || !sc.ready) return;
        try {
            sc.w.getCurrentSound(function (s) {
                if (!s || !s.id) return;
                var id = 'sc:' + s.id;
                if (id === sc.metaId) return;
                sc.metaId = id;
                var art = String(s.artwork_url || (s.user && s.user.avatar_url) || '').replace('-large.', '-t500x500.');
                send('meta', { id: id, title: String(s.title || 'Unknown'), author: String((s.user && s.user.username) || ''), art: art });
            });
        } catch (e) { }
    }

    function scTick() {
        if (!sc.w || !sc.ready) { if (n % 4 === 0) send('hb', { n: n }); return; }
        try {
            sc.w.isPaused(function (paused) {
                if (paused) { send('st', { playing: false }); return; }
                sc.w.getPosition(function (pos) {
                    sc.w.getDuration(function (dur) { send('tick', { id: sc.metaId, cur: (pos || 0) / 1000, dur: (dur || 0) / 1000 }); });
                });
                scMeta();
            });
        } catch (e) { }
    }

    function scBind() {
        var E = SC.Widget.Events;
        sc.w = SC.Widget(sc.iframe);
        sc.w.bind(E.READY, function () { sc.ready = true; try { sc.w.setVolume(wantVol); } catch (e) { } });
        sc.w.bind(E.PLAY, function () { hideHint(); scMeta(); send('play'); });
        sc.w.bind(E.PAUSE, function () { send('pause'); });
        sc.w.bind(E.FINISH, function () { send('ended'); });
        sc.w.bind(E.ERROR, function () { sendSure('blocked', { id: sc.loading || 'soundcloud', code: 'sc' }); });
    }

    function openSc(url) {
        setMode('soundcloud');
        hideHint();
        sc.loading = url;
        sc.metaId = '';
        if (!sc.iframe) {
            if (!window.SC || !SC.Widget) { setTimeout(function () { openSc(url); }, 300); return; }
            sc.iframe = document.createElement('iframe');
            sc.iframe.allow = 'autoplay';
            sc.iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + SC_OPTS;
            document.getElementById('scwrap').appendChild(sc.iframe);
            scBind();
            return;
        }
        try {
            sc.w.load(url, {
                auto_play: true, visual: true, show_comments: false, show_reposts: false, show_teaser: false, hide_related: false,
                callback: function () { try { sc.w.setVolume(wantVol); sc.w.play(); } catch (e) { } }
            });
        } catch (e) { }
    }

    window.lkOpenSc = function (url) {
        url = String(url || '').trim();
        if (!SC_RE.test(url) || url.length > 400) return;
        if (activated) { openSc(url); return; }
        pending = { sc: url };
        setMode('soundcloud');
        showGate();
        send('needgesture');
    };

    // ---------- YouTube ----------
    // id: video id (may be ''), list: playlist id (may be ''), at: start seconds
    function openNow(id, list, at) {
        at = Math.max(0, Math.floor(Number(at) || 0));
        setMode('youtube');
        if (!ready || !player) { pending = { id: id, list: list, at: at }; return; }
        hideHint();
        if (list) {
            cur = { id: id, list: list, at: at, mix: false, seekDone: !id };
            try { player.loadPlaylist({ listType: 'playlist', list: list, index: 0, startSeconds: id ? 0 : at }); } catch (e) { }
            return;
        }
        if (!id) return;
        // A single song plays as its YouTube Mix so the next songs keep coming on their own.
        cur = { id: id, list: 'RD' + id, at: at, mix: true, seekDone: false };
        try { player.loadPlaylist({ listType: 'playlist', list: 'RD' + id, index: 0, startSeconds: at }); } catch (e) { loadSingle(id, at); }
    }

    window.lkOpen = function (id, list, at) {
        id = String(id || ''); list = String(list || '');
        if (id && !ID_RE.test(id)) id = '';
        if (list && !LIST_RE.test(list)) list = '';
        if (!id && !list) return;
        // Watch Later / Liked videos are private, the embed can't play them.
        if (list === 'WL' || list === 'LL' || list === 'LM') list = '';
        if (!id && !list) return;
        if (activated) { openNow(id, list, at); return; }
        pending = { id: id, list: list, at: at || 0 };
        setMode('youtube');
        showGate();
        send('needgesture');
    };
    window.lkPlayId = function (id, at) { window.lkOpen(id, '', at); };

    var fadeT = null;
    function isSc() { return mode === 'soundcloud' && sc.w; }
    window.lkPlay = function () { try { if (isSc()) sc.w.play(); else player && player.playVideo(); } catch (e) { } };
    window.lkPause = function () { try { if (isSc()) sc.w.pause(); else player && player.pauseVideo(); } catch (e) { } };
    window.lkSeek = function (sec) {
        sec = Math.max(0, Number(sec) || 0);
        try { if (isSc()) sc.w.seekTo(sec * 1000); else player && player.seekTo(sec, true); } catch (e) { }
    };
    window.lkSetVolume = function (v) {
        wantVol = Math.max(0, Math.min(100, Number(v) || 0));
        try { player && player.setVolume(wantVol); } catch (e) { }
        try { sc.w && sc.ready && sc.w.setVolume(wantVol); } catch (e) { }
    };
    window.lkFadeTo = function (to, sec) {
        if (fadeT) { clearInterval(fadeT); fadeT = null; }
        to = Math.max(0, Math.min(100, Number(to) || 0));
        var from = wantVol, ms = (Number(sec) || 0) * 1000, t0 = Date.now();
        if (!(ms > 60)) { window.lkSetVolume(to); return; }
        fadeT = setInterval(function () {
            var k = Math.min(1, (Date.now() - t0) / ms);
            window.lkSetVolume(Math.round(from + (to - from) * k));
            if (k >= 1) { clearInterval(fadeT); fadeT = null; }
        }, 50);
    };
    window.lkNext = function () { try { if (isSc()) sc.w.next(); else player && player.nextVideo && player.nextVideo(); } catch (e) { } };
    window.lkPrev = function () {
        if (isSc()) {
            try { sc.w.getPosition(function (pos) { if (pos > 3000) sc.w.seekTo(0); else sc.w.prev(); }); } catch (e) { }
            return;
        }
        try {
            if (!player) return;
            if (player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
            var i = player.getPlaylistIndex();
            if (i > 0) player.previousVideo(); else player.seekTo(0, true);
        } catch (e) { }
    };
    window.lkMeta = function () { if (mode === 'soundcloud') { sc.metaId = ''; scMeta(); return; } lastMetaId = ''; sendMeta(); };
    window.lkRefresh = function () { if (mode === 'soundcloud') { if (sc.loading) openSc(sc.loading); return; } if (cur) openNow(cur.id, cur.mix ? '' : cur.list, 0); };
    window.lkZoom = function (z) { try { document.documentElement.style.zoom = String(Number(z) || 1); } catch (e) { } };
    window.lkRepaint = function () {
        try {
            var b = document.body;
            b.style.opacity = '0.999';
            setTimeout(function () { b.style.opacity = '1'; }, 30);
            var f = document.querySelector('#player iframe');
            if (f) { var h = f.style.height; f.style.height = '99.9%'; setTimeout(function () { f.style.height = h || '100%'; }, 30); }
        } catch (e) { }
    };
    window.lkSaveSettings = function (o) { if (o) writeSettings(o); };

    // ---------- update check / what's new / feedback ----------
    function unhex(h) { var p = String(h || '').split('-'), out = ''; for (var i = 0; i < p.length; i++) if (p[i]) out += String.fromCharCode(parseInt(p[i], 16)); return out; }
    function cleanNotes(ns) {
        if (!Array.isArray(ns)) return null;
        var t = function (x, k) { return String(x == null ? '' : x).replace(/[\u0000-\u001f]/g, ' ').substring(0, k); };
        var list = function (a) { return Array.isArray(a) ? a.slice(0, 25).map(function (x) { return t(x, 220); }) : []; };
        return ns.slice(0, 12).map(function (o) { o = o || {}; return { v: t(o.v, 20), n: list(o.n), f: list(o.f) }; });
    }
    window.lkVer = function (dev) {
        fetch(API + 'v/' + API_KEY + (dev ? '?ch=dev' : ''), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) { if (j && j.v) sendSure('ver', { v: String(j.v).substring(0, 20), notes: cleanNotes(j.notes) }); }).catch(function () { });
    };
    window.lkFeedback = function (h) {
        fetch(API + 'f/' + API_KEY, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: unhex(h) })
            .then(function (r) { sendSure('fbsent', { ok: !!r.ok }); }).catch(function () { sendSure('fbsent', { ok: false }); });
    };

    // ---------- song sharing with others in the match (end-to-end encrypted, via the relay) ----------
    var peer = { ws: null, open: false, room: '', key: null, note: '', want: false, ping: null, retry: null, fails: 0, sentReal: false, lastSend: 0, sendT: null, lastReal: '', age: 0 };
    function b64(u) { var t = ''; for (var i = 0; i < u.length; i++) t += String.fromCharCode(u[i]); return btoa(t); }
    function unb64(t) { var r = atob(t), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }
    function sha(t) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); }
    function hexOf(buf) { var a = new Uint8Array(buf), h = ''; for (var i = 0; i < a.length; i++) h += (a[i] < 16 ? '0' : '') + a[i].toString(16); return h; }
    function notePos(body) { try { var o = JSON.parse(body); if (o.c) { o.p = Math.max(0, Math.round(curPos())); return JSON.stringify(o); } } catch (e) { } return body; }
    function peerClose() {
        var ws = peer.ws; peer.ws = null; peer.open = false; peer.room = ''; peer.key = null;
        if (peer.ping) { clearInterval(peer.ping); peer.ping = null; }
        if (peer.retry) { clearTimeout(peer.retry); peer.retry = null; }
        if (peer.sendT) { clearTimeout(peer.sendT); peer.sendT = null; }
        peer.fails = 0; peer.sentReal = false; peer.lastReal = '';
        if (ws) { try { ws.close(); } catch (e) { } sendSure('peerstate', { on: false }); }
    }
    function peerSendNote() {
        if (!peer.ws || !peer.open || !peer.key) return;
        if (!peer.note && !peer.sentReal) return;
        // relay drops notes < 2s apart
        var wait = 2200 - (Date.now() - peer.lastSend);
        if (wait > 0) { if (!peer.sendT) peer.sendT = setTimeout(function () { peer.sendT = null; peerSendNote(); }, wait); return; }
        peer.lastSend = Date.now();
        var real = !!peer.note;
        var last = {}; try { last = JSON.parse(peer.lastReal || '{}'); } catch (e) { }
        var body = peer.note ? notePos(peer.note) : JSON.stringify({ off: 1, h: last.h || '', n: last.n || '' });
        if (real) peer.lastReal = peer.note;
        var iv = crypto.getRandomValues(new Uint8Array(12)); var ws = peer.ws;
        crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, peer.key, new TextEncoder().encode(body)).then(function (ct) {
            var all = new Uint8Array(12 + ct.byteLength); all.set(iv, 0); all.set(new Uint8Array(ct), 12);
            try { ws.send(b64(all)); if (real) peer.sentReal = true; sendSure('peersent', { off: !real }); } catch (e) { }
        });
    }
    function peerRecv(t, age) {
        if (!peer.key || t.length > 600) return;
        var all; try { all = unb64(t); } catch (e) { return; }
        if (all.length < 29) return;
        crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, peer.key, all.slice(12)).then(function (pt) {
            var o = JSON.parse(new TextDecoder().decode(pt));
            var nm = String(o.n || '').substring(0, 40); var hr = String(o.h || '').substring(0, 40);
            if (!nm && !hr) return;
            var m = /^y:([A-Za-z0-9_-]{11})$/.exec(String(o.c || ''));
            var bs = String(o.b || ''); if (!/^(gold|silver|dark|neon|glass|off)$/.test(bs)) bs = '';
            var ps = Number(o.p); if (!(ps >= 0 && ps < 36000)) ps = -1;
            sendSure('peer', { n: nm, h: hr, id: m ? m[1] : '', t: String(o.t || '').replace(/[\u0000-\u001f]/g, '').substring(0, 60), off: !!o.off, b: bs, p: ps, age: Math.min(3600000, Math.max(0, Number(age) || 0)) });
        }).catch(function () { });
    }
    function peerConnect() {
        if (!peer.room || !peer.key || peer.ws) return;
        var ws; try { ws = new WebSocket(RELAY + peer.room); } catch (e) { return; }
        peer.ws = ws;
        ws.onopen = function () {
            if (peer.ws !== ws) return;
            peer.open = true; peer.fails = 0; sendSure('peerstate', { on: true, room: peer.room.substring(0, 6) });
            peerSendNote();
            peer.ping = setInterval(function () { try { ws.send('ping'); } catch (e) { } }, 240000);
        };
        ws.onmessage = function (e) { var t = String(e.data); if (t === 'pong') return; if (t.indexOf('age:') === 0) { peer.age = Number(t.substring(4)) || 0; return; } var age = peer.age || 0; peer.age = 0; peerRecv(t, age); };
        ws.onclose = function () {
            if (peer.ws !== ws) return;
            peer.ws = null; peer.open = false;
            if (peer.ping) { clearInterval(peer.ping); peer.ping = null; }
            sendSure('peerstate', { on: false });
            peer.fails++;
            var delays = [8000, 30000, 120000, 300000];
            if (peer.want && peer.room && peer.fails <= 5) peer.retry = setTimeout(function () { peer.retry = null; peerConnect(); }, delays[Math.min(peer.fails - 1, delays.length - 1)]);
        };
    }
    window.lkPeer = function (roomHex, noteHex, show) {
        if (!window.crypto || !crypto.subtle || !window.WebSocket) return;
        var src = unhex(roomHex); var note = unhex(noteHex);
        peer.want = !!(src && (show || note));
        if (!peer.want) { peerClose(); peer.note = note; return; }
        sha('dlr-room|' + src).then(function (rb) {
            var r = hexOf(rb);
            if (r === peer.room) { if (note !== peer.note) { peer.note = note; peerSendNote(); } return; }
            peerClose(); peer.note = note; peer.room = r;
            return sha('dlr-note|' + API_KEY + '|' + r).then(function (kb) {
                return crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['encrypt', 'decrypt']);
            }).then(function (k) { if (peer.room !== r) return; peer.key = k; peerConnect(); });
        }).catch(function () { });
    };

    // ---------- commands in (URL hash) ----------
    function onHash() {
        var h = location.hash.slice(1);
        if (!h) return;
        var s;
        try { s = decodeURIComponent(h); } catch (e) { return; }
        if (s.charAt(0) === 'c' && s.charAt(1) === ':') {
            var p = s.indexOf(':', 2);
            var code = p >= 0 ? s.slice(p + 1) : s.slice(2);
            if (/^\s*window\.lk[A-Za-z]/.test(code)) { try { (0, eval)(code); } catch (e) { } }
            return;
        }
        var msg;
        try { msg = JSON.parse(s); } catch (e) { return; }
        if (msg && msg.fn && /^lk[A-Za-z]+$/.test(msg.fn) && typeof window[msg.fn] === 'function') { try { window[msg.fn].apply(null, msg.a || []); } catch (e) { } }
    }
    window.addEventListener('hashchange', onHash);

    // ---------- click gate (browsers need one real click before sound) ----------
    function showGate() { var g = document.getElementById('gate'); if (g) g.className = 'on'; }
    function hideGate() { var g = document.getElementById('gate'); if (g) g.className = ''; }
    function doActivate() {
        activated = true;
        hideGate();
        if (pending) { var p = pending; pending = null; if (p.sc) openSc(p.sc); else openNow(p.id, p.list, p.at); }
        else { window.lkPlay(); }
        send('activated');
    }
    document.getElementById('gateBtn').addEventListener('click', doActivate);

    // ---------- paste box ----------
    function parseInput(s) {
        s = String(s || '').trim();
        if (!s) return null;
        if (SC_RE.test(s)) return { sc: s };
        var list = (s.match(/[?&]list=([A-Za-z0-9_-]+)/) || [])[1] || '';
        var vm = s.match(/[?&]v=([A-Za-z0-9_-]{11})/) || s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/) || s.match(/\/embed\/([A-Za-z0-9_-]{11})/) || s.match(/\/shorts\/([A-Za-z0-9_-]{11})/) || s.match(/^([A-Za-z0-9_-]{11})$/);
        var t = parseInt((s.match(/[?&]t=(\d+)/) || [])[1] || '0', 10) || 0;
        var vid = vm ? vm[1] : '';
        if (!list && !vid) return null;
        return { list: list, video: vid, at: t };
    }
    function goPaste() {
        activated = true; hideGate(); send('activated');
        var info = parseInput(document.getElementById('url').value);
        if (!info) return;
        pending = null;
        if (info.sc) window.lkOpenSc(info.sc); else window.lkOpen(info.video, info.list, info.at);
    }
    document.getElementById('go').addEventListener('click', goPaste);
    document.getElementById('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') goPaste(); });

    hello();
    setTimeout(hello, 600);
    setTimeout(hello, 1800);
    if (location.hash) onHash();
})();
